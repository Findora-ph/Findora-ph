<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Findora PH</title>
<style>
:root{--bg:#f5eee6;--card:#fffaf5;--text:#2d2723;--muted:#7e7066;--accent:#8b6b4e;--line:#e7d8ca}*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#f7f0e8,#eadccd);color:var(--text)}.wrap{max-width:1050px;margin:auto;padding:14px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:30px 18px;text-align:center}.logo{width:90px;height:90px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#fff7ee;border:2px solid #ccb096;font:700 38px Georgia;color:var(--accent)}
h1{font:700 34px Georgia;margin:10px 0 4px}.sub{margin:0;color:var(--muted)}.toolbar{position:sticky;top:0;z-index:10;background:rgba(245,238,230,.9);padding:12px 0}.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.filters{display:flex;gap:7px;overflow:auto;padding-top:9px}.filter{border:1px solid var(--line);background:#fff9f3;border-radius:999px;padding:8px 12px;white-space:nowrap}.filter.active{background:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:23px;overflow:hidden}.visual{height:175px;background:linear-gradient(145deg,#ead8c7,#fff8ef);display:grid;place-items:center;position:relative}.visual img{width:100%;height:100%;object-fit:cover}.emoji{font-size:70px}.num{position:absolute;left:12px;top:12px;background:#fff;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900}.content{padding:15px}.cat{font-size:10px;font-weight:900;color:var(--accent);text-transform:uppercase}.card h3{font:700 19px Georgia;margin:5px 0 7px}.price{font-weight:900}.desc{color:var(--muted);font-size:12px;line-height:1.5}.btn{display:block;margin-top:13px;text-align:center;text-decoration:none;background:var(--accent);color:#fff;padding:12px;border-radius:14px;font-weight:900}.head{display:flex;justify-content:space-between;align-items:end;margin:18px 2px 12px}.notice{margin-top:24px;background:#fff9f1;border:1px solid var(--line);border-radius:18px;padding:14px;color:var(--muted);font-size:11px}footer{text-align:center;color:var(--muted);font-size:11px;padding:22px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.visual{height:155px}}
</style></head><body><div class="wrap"><header class="hero"><div class="logo">F</div><h1>Findora PH</h1><p class="sub">Good Finds. Better Choices.</p></header>
<div class="toolbar"><input id="search" class="search" placeholder="Search a Findora find..."><div id="filters" class="filters"></div></div>
<div class="head"><h2>Findora Finds</h2><small id="count"></small></div><main id="grid" class="grid"></main>
<div class="notice"><b>Affiliate Disclosure:</b> Some links are affiliate links. Findora PH may earn a small commission at no extra cost to you.</div><footer>© 2026 Findora PH</footer></div>
<script>
let products=[],current='All';const g=document.getElementById('grid'),s=document.getElementById('search'),f=document.getElementById('filters'),c=document.getElementById('count');
const e=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function filters(){let cats=['All',...new Set(products.map(x=>x.category))];f.innerHTML=cats.map(x=>`<button class="filter ${x==='All'?'active':''}" data-x="${e(x)}">${e(x)}</button>`).join('');f.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.x;f.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()})}
function render(){let q=s.value.toLowerCase(),a=products.filter(p=>(current==='All'||p.category===current)&&JSON.stringify(p).toLowerCase().includes(q)).sort((a,b)=>Number(b.id)-Number(a.id));c.textContent=a.length+' finds';g.innerHTML=a.map(p=>`<article class="card"><div class="visual">${p.image?`<img src="${e(p.image)}" alt="${e(p.name)}">`:`<div class="emoji">${e(p.emoji||'✨')}</div>`}<div class="num">FIND #${e(p.id)}</div></div><div class="content"><div class="cat">${e(p.category)}</div><h3>${e(p.name)}</h3><div class="price">${e(p.price)}</div><p class="desc">${e(p.description)}</p><a class="btn" href="${e(p.link)}" target="_blank">View on Shopee →</a></div></article>`).join('')}
s.oninput=render;fetch('/api/products',{cache:'no-store'}).then(r=>r.json()).then(d=>{products=d.products||[];filters();render()}).catch(()=>g.innerHTML='<p>Could not load products.</p>');
</script></body></html>
