<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Findora PH</title>

<style>
:root{
  --bg:#f5eee6;
  --card:#fffaf5;
  --text:#2d2723;
  --muted:#7e7066;
  --accent:#8b6b4e;
  --line:#e7d8ca;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(#f7f0e8,#eadccd);
  color:var(--text);
  min-height:100vh;
}

.wrap{
  max-width:1050px;
  margin:auto;
  padding:14px;
}

/* HERO */

.hero{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:28px;
  padding:30px 18px;
  text-align:center;
}

.logo{
  width:90px;
  height:90px;
  margin:auto;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#fff7ee;
  border:2px solid #ccb096;
  font:700 38px Georgia;
  color:var(--accent);
}

h1{
  font:700 34px Georgia;
  margin:10px 0 4px;
}

.sub{
  margin:0;
  color:var(--muted);
}

/* SEARCH + FILTER */

.toolbar{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(245,238,230,.94);
  backdrop-filter:blur(8px);
  padding:12px 0;
}

.search{
  width:100%;
  padding:14px;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--card);
  font-size:15px;
  outline:none;
}

.search:focus{
  border-color:var(--accent);
}

.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-top:9px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  border:1px solid var(--line);
  background:#fff9f3;
  color:var(--text);
  border-radius:999px;
  padding:8px 13px;
  white-space:nowrap;
  cursor:pointer;
  font-weight:600;
}

.filter.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}

/* HEADING */

.head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin:18px 2px 12px;
}

.head h2{
  margin:0;
}

#count{
  color:var(--muted);
}

/* PRODUCT GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

/* PRODUCT CARD */

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:23px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  min-width:0;
  box-shadow:0 5px 18px rgba(80,55,35,.06);
}

.visual{
  position:relative;
  width:100%;
  aspect-ratio:1 / 1;
  overflow:hidden;
  background:linear-gradient(145deg,#ead8c7,#fff8ef);
  display:grid;
  place-items:center;
}

/* Uploaded product image */

.product-image{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center;
}

/* Emoji fallback */

.emoji{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  font-size:72px;
}

/* FIND NUMBER */

.num{
  position:absolute;
  left:10px;
  top:10px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(5px);
  padding:6px 9px;
  border-radius:999px;
  font-size:10px;
  font-weight:900;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

/* CARD CONTENT */

.content{
  padding:15px;
  display:flex;
  flex-direction:column;
  flex:1;
}

.cat{
  font-size:10px;
  font-weight:900;
  color:var(--accent);
  text-transform:uppercase;
  letter-spacing:.5px;
}

.card h3{
  font:700 19px Georgia;
  margin:6px 0 7px;
  overflow-wrap:anywhere;
}

.price{
  font-weight:900;
  color:var(--accent);
  font-size:17px;
}

.desc{
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
  margin-bottom:4px;
  overflow-wrap:anywhere;
}

.btn{
  display:block;
  margin-top:auto;
  padding-top:13px;
  padding-bottom:13px;
  text-align:center;
  text-decoration:none;
  background:var(--accent);
  color:#fff;
  border-radius:14px;
  font-weight:900;
}

/* EMPTY STATE */

.empty{
  grid-column:1/-1;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:35px 20px;
  text-align:center;
  color:var(--muted);
}

/* DISCLOSURE */

.notice{
  margin-top:24px;
  background:#fff9f1;
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}

footer{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  padding:22px;
}

/* PHONE */

@media(max-width:650px){

  .wrap{
    padding:10px;
  }

  .hero{
    border-radius:22px;
    padding:24px 14px;
  }

  .logo{
    width:76px;
    height:76px;
    font-size:32px;
  }

  h1{
    font-size:30px;
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
  }

  .card{
    border-radius:17px;
  }

  .content{
    padding:11px;
  }

  .card h3{
    font-size:15px;
  }

  .price{
    font-size:15px;
  }

  .desc{
    font-size:11px;
  }

  .btn{
    font-size:12px;
    padding:11px 6px;
  }

  .emoji{
    font-size:55px;
  }

  .num{
    left:7px;
    top:7px;
    padding:5px 7px;
    font-size:9px;
  }
}

/* VERY SMALL PHONE */

@media(max-width:350px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="wrap">

<header class="hero">
  <div class="logo">F</div>

  <h1>Findora PH</h1>

  <p class="sub">
    Good Finds. Better Choices.
  </p>
</header>

<div class="toolbar">

  <input
    id="search"
    class="search"
    type="search"
    placeholder="Search a Findora find..."
  >

  <div
    id="filters"
    class="filters">
  </div>

</div>

<div class="head">

  <h2>Findora Finds</h2>

  <small id="count"></small>

</div>

<main
  id="grid"
  class="grid">
</main>

<div class="notice">

  <b>Affiliate Disclosure:</b>

  Some links are affiliate links.
  Findora PH may earn a small commission
  at no extra cost to you.

</div>

<footer>
  © 2026 Findora PH
</footer>

</div>

<script>

let products = [];
let currentCategory = "All";

const grid = document.getElementById("grid");
const search = document.getElementById("search");
const filtersContainer = document.getElementById("filters");
const count = document.getElementById("count");


/* =========================
   HTML ESCAPE
========================= */

function escapeHTML(value){

  return String(value ?? "").replace(
    /[&<>"']/g,
    character => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[character])
  );

}


/* =========================
   CATEGORY FILTERS
========================= */

function renderFilters(){

  const categories = [
    "All",
    ...new Set(
      products
        .map(product => product.category)
        .filter(Boolean)
    )
  ];

  filtersContainer.innerHTML =
    categories.map(category => `

      <button
        class="filter ${
          category === currentCategory
            ? "active"
            : ""
        }"
        data-category="${escapeHTML(category)}"
      >

        ${escapeHTML(category)}

      </button>

    `).join("");


  filtersContainer
    .querySelectorAll(".filter")
    .forEach(button => {

      button.addEventListener("click",()=>{

        currentCategory =
          button.dataset.category;

        renderFilters();
        renderProducts();

      });

    });

}


/* =========================
   PRODUCT IMAGE
========================= */

function createVisual(product){

  const emoji =
    escapeHTML(product.emoji || "🛍️");

  if(product.image){

    return `

      <img
        class="product-image"
        src="${escapeHTML(product.image)}"
        alt="${escapeHTML(product.name || "Findora PH product")}"
        loading="lazy"

        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='grid';
        "
      >

      <div
        class="emoji"
        style="display:none"
      >
        ${emoji}
      </div>

    `;

  }

  return `

    <div class="emoji">
      ${emoji}
    </div>

  `;

}


/* =========================
   PRODUCT RENDER
========================= */

function renderProducts(){

  const query =
    search.value
      .trim()
      .toLowerCase();


  const filteredProducts =
    products

      .filter(product => {

        const correctCategory =
          currentCategory === "All" ||
          product.category === currentCategory;

        const searchableText = [

          product.id,
          product.name,
          product.category,
          product.description,
          product.price

        ]
        .join(" ")
        .toLowerCase();

        const matchesSearch =
          searchableText.includes(query);

        return (
          correctCategory &&
          matchesSearch
        );

      })

      .sort(
        (a,b)=>
          Number(b.id) -
          Number(a.id)
      );


  count.textContent =
    `${filteredProducts.length} ${
      filteredProducts.length === 1
        ? "find"
        : "finds"
    }`;


  if(!filteredProducts.length){

    grid.innerHTML = `

      <div class="empty">

        🔎 No Findora finds found.

      </div>

    `;

    return;

  }


  grid.innerHTML =
    filteredProducts.map(product => `

      <article class="card">

        <div class="visual">

          ${createVisual(product)}

          <div class="num">

            FIND #${escapeHTML(product.id)}

          </div>

        </div>


        <div class="content">

          <div class="cat">

            ${escapeHTML(
              product.category || "Others"
            )}

          </div>


          <h3>

            ${escapeHTML(
              product.name || "Findora Find"
            )}

          </h3>


          <div class="price">

            ${escapeHTML(
              product.price || ""
            )}

          </div>


          <p class="desc">

            ${escapeHTML(
              product.description || ""
            )}

          </p>


          ${
            product.link
              ? `

                <a
                  class="btn"
                  href="${escapeHTML(product.link)}"
                  target="_blank"
                  rel="noopener noreferrer sponsored"
                >

                  View on Shopee →

                </a>

              `
              : ""
          }

        </div>

      </article>

    `).join("");

}


/* =========================
   SEARCH
========================= */

search.addEventListener(
  "input",
  renderProducts
);


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  try{

    const response =
      await fetch(
        "/api/products",
        {
          cache:"no-store"
        }
      );


    if(!response.ok){
      throw new Error(
        "Unable to load products."
      );
    }


    const data =
      await response.json();


    products =
      Array.isArray(data.products)
        ? data.products
        : [];


    renderFilters();
    renderProducts();

  }

  catch(error){

    console.error(error);

    count.textContent = "";

    grid.innerHTML = `

      <div class="empty">

        ⚠️ Could not load products.
        Please refresh the page.

      </div>

    `;

  }

}


loadProducts();

</script>

</body>
  </html>
