<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Findora PH Admin</title>
<style>body{margin:0;background:#f5eee6;font-family:Arial;color:#2d2723}.wrap{max-width:760px;margin:auto;padding:16px}.panel{background:#fffaf5;border:1px solid #e7d8ca;border-radius:22px;padding:20px;margin-bottom:14px}h1,h2{font-family:Georgia}label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px}input,textarea,select{width:100%;padding:12px;border:1px solid #e7d8ca;border-radius:12px;box-sizing:border-box}textarea{min-height:80px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:800}.primary{background:#8b6b4e;color:#fff}.danger{background:#fee8e5;color:#8d332b}.item{border-top:1px solid #e7d8ca;padding:12px 0;display:flex;justify-content:space-between;gap:10px}.status{margin-top:10px;padding:10px;border-radius:10px;display:none}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><div class="panel"><h1>Findora PH Admin</h1><p>Add a product here and it will appear automatically on the public website.</p></div>
<div class="panel"><h2>Admin Access</h2><label>Password</label><input id="password" type="password"></div>
<div class="panel"><h2>Add / Update Find</h2><div class="row"><div><label>Find Number</label><input id="id" placeholder="011"></div><div><label>Emoji</label><input id="emoji" placeholder="✨"></div></div>
<label>Product Name</label><input id="name"><div class="row"><div><label>Price</label><input id="price"></div><div><label>Category</label><select id="category"><option>Tech</option><option>Home</option><option>Kitchen</option><option>Fashion</option><option>Travel</option><option>Lifestyle</option><option>School</option><option>Other</option></select></div></div>
<label>Description</label><textarea id="description"></textarea><label>Shopee Affiliate Link</label><input id="link"><label>Product Image URL (optional)</label><input id="image">
<p><button id="save" class="btn primary">Publish Product</button></p><div id="status" class="status"></div></div><div class="panel"><h2>Current Products</h2><div id="list">Loading...</div></div></div>
<script>
const $=x=>document.getElementById(x),fields=['id','emoji','name','price','category','description','link','image'];
function show(m,ok=true){$('status').style.display='block';$('status').style.background=ok?'#e8f5eb':'#fee8e5';$('status').textContent=m}
async function load(){let r=await fetch('/api/products',{cache:'no-store'}),d=await r.json(),ps=d.products||[];$('list').innerHTML=ps.sort((a,b)=>Number(b.id)-Number(a.id)).map(p=>`<div class="item"><div><b>#${p.id} — ${p.name}</b><br><small>${p.price}</small></div><button class="btn danger" onclick="del('${p.id}')">Delete</button></div>`).join('')}
$('save').onclick=async()=>{let p={};fields.forEach(x=>p[x]=$(x).value.trim());if(!p.id||!p.name||!p.link)return show('Find number, name, and Shopee link are required.',false);let r=await fetch('/api/products',{method:'POST',headers:{'content-type':'application/json','x-admin-password':$('password').value},body:JSON.stringify(p)}),d=await r.json();if(!r.ok)return show(d.error||'Save failed',false);show('Published successfully!');load()}
async function del(id){if(!confirm('Delete Find #'+id+'?'))return;let r=await fetch('/api/products',{method:'DELETE',headers:{'content-type':'application/json','x-admin-password':$('password').value},body:JSON.stringify({id})}),d=await r.json();if(!r.ok)return show(d.error||'Delete failed',false);show('Deleted.');load()}load();
</script></body></html>
