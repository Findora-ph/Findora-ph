<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Findora PH Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5efe6;
  color:#2c2c2c;
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}

h1{margin-bottom:4px}

.subtitle{
  color:#7a695a;
  margin-bottom:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

label{
  display:block;
  font-weight:bold;
  margin-top:12px;
  margin-bottom:6px;
}

input,textarea,select{
  width:100%;
  padding:13px;
  border:1px solid #d8cec4;
  border-radius:12px;
  font-size:16px;
  background:#fff;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:none;
  border-radius:12px;
  padding:13px 18px;
  font-size:15px;
  cursor:pointer;
  font-weight:bold;
}

.primary{
  width:100%;
  background:#8b6b4e;
  color:white;
  margin-top:16px;
}

.copy{
  width:100%;
  background:#2c2c2c;
  color:white;
  margin-top:10px;
}

.secondary{
  background:#eee6de;
  color:#55483e;
}

.danger{
  background:#f6dddd;
  color:#8c2727;
}

.status{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  display:none;
}

.success{
  display:block;
  background:#e4f3e7;
  color:#286538;
}

.error{
  display:block;
  background:#f9dddd;
  color:#8b2222;
}

.preview{
  background:#faf7f3;
  border:1px solid #eadfd5;
  border-radius:16px;
  padding:16px;
  margin-top:14px;
}

.preview-emoji{font-size:40px}

.preview h3{
  margin:8px 0 5px;
}

.preview-price{
  font-weight:bold;
  color:#8b6b4e;
}

.caption-box{
  background:#faf7f3;
  border:1px solid #eadfd5;
  border-radius:16px;
  padding:16px;
  margin-top:18px;
}

.caption-text{
  white-space:pre-wrap;
  line-height:1.55;
  font-size:15px;
  margin-top:10px;
}

.products{
  display:grid;
  gap:12px;
}

.product-row{
  border:1px solid #eadfd5;
  border-radius:14px;
  padding:14px;
}

.product-top{
  display:flex;
  gap:10px;
  align-items:center;
}

.product-emoji{font-size:30px}

.product-name{font-weight:bold}

.product-meta{
  font-size:13px;
  color:#777;
  margin-top:3px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.actions button{flex:1}

.small{
  font-size:13px;
  color:#806f61;
}

@media(min-width:700px){
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>Findora PH Admin 🛒</h1>
<div class="subtitle">Good Finds. Better Choices.</div>

<div class="card">

<h2>Add / Edit Product</h2>

<label>Admin Password</label>
<input id="password" type="password"
placeholder="Enter admin password">

<div class="grid">

<div>
<label>Find Number</label>
<input id="id" type="text" readonly>
</div>

<div>
<label>Emoji</label>
<input id="emoji" type="text" value="🛍️">
</div>

</div>

<label>Product Name</label>
<input id="name" type="text"
placeholder="Example: Automatic UV Umbrella">

<div class="grid">

<div>
<label>Price</label>
<input id="price" type="text"
placeholder="Example: ₱99">
</div>

<div>
<label>Category</label>

<select id="category">
<option>Tech</option>
<option>Home</option>
<option>Fashion</option>
<option>Travel</option>
<option>Kitchen</option>
<option>Lifestyle</option>
<option>School</option>
<option>Others</option>
</select>

</div>

</div>

<label>Description</label>

<textarea id="description"
placeholder="Short product description..."></textarea>

<label>Shopee Affiliate Link</label>

<input id="link" type="url"
placeholder="https://s.shopee.ph/...">

<!-- PRODUCT PREVIEW -->

<div class="preview">

<div class="small">Product Preview</div>

<div id="previewEmoji"
class="preview-emoji">🛍️</div>

<h3 id="previewName">
Product Name
</h3>

<div id="previewPrice"
class="preview-price">
Price
</div>

<p id="previewDescription">
Product description will appear here.
</p>

</div>

<!-- CAPTION GENERATOR -->

<div class="caption-box">

<strong>📣 Facebook Caption</strong>

<div class="small">
Automatically generated from your product details.
</div>

<div id="caption"
class="caption-text"></div>

<button id="copyBtn"
class="copy">
📋 Copy Facebook Caption
</button>

</div>

<button id="saveBtn"
class="primary">
🚀 Publish Product
</button>

<div id="status"
class="status"></div>

</div>


<!-- EXISTING PRODUCTS -->

<div class="card">

<h2>Existing Products</h2>

<div class="small">
Edit or delete products already published on Findora PH.
</div>

<div id="products"
class="products"
style="margin-top:14px">
</div>

</div>

</div>


<script>

let products=[];
let editingId=null;

const $=id=>document.getElementById(id);


/* UNICODE SERIF BOLD */

function boldSerif(text){

const normal=
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

const bold=[
"𝐀","𝐁","𝐂","𝐃","𝐄","𝐅","𝐆","𝐇","𝐈","𝐉","𝐊","𝐋","𝐌",
"𝐍","𝐎","𝐏","𝐐","𝐑","𝐒","𝐓","𝐔","𝐕","𝐖","𝐗","𝐘","𝐙",

"𝐚","𝐛","𝐜","𝐝","𝐞","𝐟","𝐠","𝐡","𝐢","𝐣","𝐤","𝐥","𝐦",
"𝐧","𝐨","𝐩","𝐪","𝐫","𝐬","𝐭","𝐮","𝐯","𝐰","𝐱","𝐲","𝐳",

"𝟎","𝟏","𝟐","𝟑","𝟒","𝟓","𝟔","𝟕","𝟖","𝟗"
];

return [...text].map(c=>{
const i=normal.indexOf(c);
return i>=0 ? bold[i] : c;
}).join("");

}


/* LOAD PRODUCTS */

async function loadProducts(){

try{

const response=
await fetch("/api/products",{
cache:"no-store"
});

const data=await response.json();

products=
Array.isArray(data.products)
? data.products
:[];

renderProducts();
setNextNumber();
updatePreview();

}catch(error){

showStatus(
"Unable to load products.",
"error"
);

}

}


/* AUTO NUMBER */

function setNextNumber(){

if(editingId)return;

const ids=products
.map(p=>parseInt(p.id,10))
.filter(n=>!isNaN(n));

const next=
ids.length
? Math.max(...ids)+1
:1;

$("id").value=
String(next).padStart(3,"0");

generateCaption();

}


/* PREVIEW */

function updatePreview(){

$("previewEmoji").textContent=
$("emoji").value || "🛍️";

$("previewName").textContent=
$("name").value || "Product Name";

$("previewPrice").textContent=
$("price").value || "Price";

$("previewDescription").textContent=
$("description").value ||
"Product description will appear here.";

generateCaption();

}


/* CAPTION */

function generateCaption(){

const id=
$("id").value || "000";

const emoji=
$("emoji").value || "🛍️";

const name=
$("name").value ||
"Product Name";

const price=
$("price").value ||
"Check latest price";

const description=
$("description").value ||
"Another useful and worth-checking Findora PH find!";

const link=
$("link").value ||
"[Shopee Affiliate Link]";

const title=
boldSerif(
`FINDORA PH FINDS #${id}`
);

const productTitle=
boldSerif(name);

const priceBold=
boldSerif(price);

const cta=
boldSerif("Worth the cart? 🛒");

const caption=
`${title} ${emoji}

${productTitle} 👀

${description}

💸 ${priceBold}

${cta}

🔗 ${link}

#FindoraPH #FindoraPHFinds #ShopeeFinds #SulitFinds #BudolFindsPH`;

$("caption").textContent=caption;

}


/* LIVE INPUT */

[
"emoji",
"name",
"price",
"description",
"link"
].forEach(id=>{

$(id).addEventListener(
"input",
updatePreview
);

});


/* COPY CAPTION */

$("copyBtn").addEventListener(
"click",
async()=>{

const text=
$("caption").textContent;

try{

await navigator.clipboard
.writeText(text);

showStatus(
"✓ Facebook caption copied!",
"success"
);

}catch{

const area=
document.createElement("textarea");

area.value=text;

document.body.appendChild(area);

area.select();

document.execCommand("copy");

area.remove();

showStatus(
"✓ Facebook caption copied!",
"success"
);

}

});


/* RENDER PRODUCTS */

function renderProducts(){

const container=$("products");

container.innerHTML="";

const sorted=[...products].sort(
(a,b)=>Number(b.id)-Number(a.id)
);

sorted.forEach(product=>{

const row=
document.createElement("div");

row.className="product-row";

row.innerHTML=`

<div class="product-top">

<div class="product-emoji">
${product.emoji || "🛍️"}
</div>

<div>

<div class="product-name">
#${product.id}
${product.name}
</div>

<div class="product-meta">
${product.category || "Others"}
•
${product.price || ""}
</div>

</div>

</div>

<div class="actions">

<button class="secondary"
onclick="editProduct('${product.id}')">
✏️ Edit
</button>

<button class="danger"
onclick="deleteProduct('${product.id}')">
🗑️ Delete
</button>

</div>

`;

container.appendChild(row);

});

}


/* EDIT */

function editProduct(id){

const product=
products.find(
p=>String(p.id)===String(id)
);

if(!product)return;

editingId=product.id;

$("id").value=product.id;
$("emoji").value=product.emoji || "";
$("name").value=product.name || "";
$("price").value=product.price || "";
$("category").value=
product.category || "Others";
$("description").value=
product.description || "";
$("link").value=
product.link || "";

$("saveBtn").textContent=
"💾 Update Product";

updatePreview();

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* CLEAR FORM */

function clearForm(){

editingId=null;

$("emoji").value="🛍️";
$("name").value="";
$("price").value="";
$("category").value="Tech";
$("description").value="";
$("link").value="";

$("saveBtn").textContent=
"🚀 Publish Product";

setNextNumber();
updatePreview();

}


/* SAVE PRODUCT */

async function saveProduct(){

const password=
$("password").value.trim();

if(!password){

showStatus(
"Enter your admin password.",
"error"
);

return;

}

const product={

id:$("id").value.trim(),

emoji:$("emoji").value.trim(),

name:$("name").value.trim(),

price:$("price").value.trim(),

category:$("category").value,

description:
$("description").value.trim(),

link:$("link").value.trim()

};


if(!product.name){

showStatus(
"Product name is required.",
"error"
);

return;

}


$("saveBtn").disabled=true;

$("saveBtn").textContent=
editingId
? "Updating..."
: "Publishing...";


try{

const response=
await fetch(
"/api/products",
{

method:"POST",

headers:{
"content-type":
"application/json",

"x-admin-password":
password
},

body:
JSON.stringify(product)

});

const data=
await response.json();


if(!response.ok){

throw new Error(
data.error ||
"Publish failed"
);

}


products=
data.products || [];

const savedId=
product.id;

renderProducts();

clearForm();

showStatus(
`✓ Find #${savedId} published successfully!`,
"success"
);


}catch(error){

showStatus(
error.message,
"error"
);

}finally{

$("saveBtn").disabled=false;

if(!editingId){

$("saveBtn").textContent=
"🚀 Publish Product";

}

}

}


/* DELETE */

async function deleteProduct(id){

const password=
$("password").value.trim();

if(!password){

showStatus(
"Enter your admin password first.",
"error"
);

return;

}

const product=
products.find(
p=>String(p.id)===String(id)
);

const confirmed=
confirm(
`Delete #${id} ${product?.name || ""}?`
);

if(!confirmed)return;


try{

const response=
await fetch(
"/api/products",
{

method:"DELETE",

headers:{
"content-type":
"application/json",

"x-admin-password":
password
},

body:
JSON.stringify({id})

});


const data=
await response.json();


if(!response.ok){

throw new Error(
data.error ||
"Delete failed"
);

}


products=
data.products || [];

renderProducts();

if(
editingId &&
String(editingId)===String(id)
){

clearForm();

}else{

setNextNumber();

}

showStatus(
`✓ Find #${id} deleted.`,
"success"
);


}catch(error){

showStatus(
error.message,
"error"
);

}

}


/* STATUS */

function showStatus(message,type){

const status=$("status");

status.textContent=message;

status.className=
`status ${type}`;

setTimeout(()=>{

status.className="status";

},5000);

}


/* BUTTON */

$("saveBtn")
.addEventListener(
"click",
saveProduct
);


updatePreview();
loadProducts();

</script>

</body>
</html>
